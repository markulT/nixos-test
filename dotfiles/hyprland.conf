# ~/.config/hypr/hyprland.conf
# Managed by NixOS — edit dotfiles/hyprland.conf in your config repo,
# then run: sudo nixos-rebuild switch --flake .#nixos-laptop

###################
### MONITORS     ###
###################
# "preferred" = native resolution, "auto" = position, 1 = scale
monitor=,preferred,auto,1


###################
### ENV VARS     ###
###################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### AUTOSTART    ###
###################
# exec-once = waybar          # uncomment when waybar is installed
# exec-once = hyprpaper       # uncomment when hyprpaper is installed


###################
### LOOK & FEEL  ###
###################
general {
    gaps_in  = 4
    gaps_out = 8
    border_size = 2

    col.active_border   = rgba(88c0d0ff) rgba(81a1c1ff) 45deg
    col.inactive_border = rgba(3b4252aa)

    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity   = 1.0
    inactive_opacity = 0.93

    drop_shadow       = true
    shadow_range      = 10
    shadow_render_power = 2
    col.shadow        = rgba(1a1a1aee)
}

animations {
    enabled = true

    bezier = smooth, 0.05, 0.9, 0.1, 1.0

    animation = windows,    1, 4, smooth
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = border,     1, 8, default
    animation = fade,       1, 5, default
    animation = workspaces, 1, 4, smooth
}

dwindle {
    pseudotile     = true   # Super+P to toggle
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
}


###################
### INPUT        ###
###################
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll  = true
        tap-to-click    = true
        drag_lock       = true
    }
}

gestures {
    workspace_swipe         = true
    workspace_swipe_fingers = 3
}


###################
### KEYBINDINGS  ###
###################
$mod      = SUPER
$terminal = kitty
$menu     = wofi --show drun

# --- Core ---
bind = $mod,       Return, exec,          $terminal
bind = $mod,       Q,      killactive
bind = $mod SHIFT, Q,      exit                          # exit Hyprland
bind = $mod,       Space,  exec,          $menu
bind = $mod,       F,      fullscreen
bind = $mod,       V,      togglefloating
bind = $mod,       P,      pseudo                        # dwindle pseudo-tile
bind = $mod,       J,      togglesplit                   # dwindle split direction

# --- Focus (arrow keys) ---
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# --- Move window (arrow keys) ---
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# --- Resize window ---
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive,  40 0
binde = $mod CTRL, up,    resizeactive,  0 -40
binde = $mod CTRL, down,  resizeactive,  0  40

# --- Workspaces: switch ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# --- Workspaces: move window to ---
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# --- Workspaces: scroll through with mouse wheel ---
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# --- Workspaces: move window silently (no follow) ---
bind = $mod ALT, 1, movetoworkspacesilent, 1
bind = $mod ALT, 2, movetoworkspacesilent, 2
bind = $mod ALT, 3, movetoworkspacesilent, 3
bind = $mod ALT, 4, movetoworkspacesilent, 4
bind = $mod ALT, 5, movetoworkspacesilent, 5

# --- Mouse: drag/resize floating windows ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
